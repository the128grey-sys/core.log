<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>core.log — notes from the stack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
    rel="stylesheet"
  />
  <style>
    /* =========================================================================
       1. THEME TOKENS (LIGHT / DIM / DARK + SYNTAX PALETTES)
       ========================================================================= */
    :root {
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --font-serif: "Newsreader", Georgia, Cambria, "Times New Roman", serif;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --ease-spring: cubic-bezier(0.22, 1.28, 0.36, 1);
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    :root,
    :root[data-theme="light"] {
      --bg-canvas: #f7f5ef;
      --bg-surface: #ffffff;
      --bg-surface-alt: #f0ece2;
      --bg-code: #f3efe6;
      --bg-code-header: #e9e3d5;
      --bg-pill: #eae5d8;
      --bg-overlay: rgba(24, 22, 19, 0.56);

      --text-primary: #1b1917;
      --text-secondary: #4e4942;
      --text-muted: #756e64;
      --text-inverse: #fcfbf8;

      --accent: #b84a14;
      --accent-hover: #96390b;
      --accent-soft: rgba(184, 74, 20, 0.11);
      --accent-ring: rgba(184, 74, 20, 0.45);
      --ok: #1e7a46;
      --warn: #9c6200;

      --border-subtle: rgba(27, 25, 23, 0.1);
      --border-strong: rgba(27, 25, 23, 0.2);

      --shadow-card: 0 2px 8px rgba(27, 25, 23, 0.05);
      --shadow-card-hover: 0 14px 28px rgba(27, 25, 23, 0.11), 0 3px 8px rgba(184, 74, 20, 0.08);
      --shadow-modal: 0 24px 64px rgba(20, 18, 15, 0.24);

      /* Syntax tokens (Light) */
      --syn-kw: #9b2c59;
      --syn-fn: #1d4ed8;
      --syn-str: #1f6f43;
      --syn-num: #b45309;
      --syn-cmt: #7c756b;
      --syn-type: #0f766e;
      --syn-op: #57534e;
    }

    :root[data-theme="dim"] {
      --bg-canvas: #23201c;
      --bg-surface: #2c2823;
      --bg-surface-alt: #34302a;
      --bg-code: #1d1a17;
      --bg-code-header: #27231f;
      --bg-pill: #38332c;
      --bg-overlay: rgba(12, 10, 8, 0.68);

      --text-primary: #e8e0d2;
      --text-secondary: #bdb2a1;
      --text-muted: #8f8474;
      --text-inverse: #1c1916;

      --accent: #e07a3d;
      --accent-hover: #f08d50;
      --accent-soft: rgba(224, 122, 61, 0.14);
      --accent-ring: rgba(224, 122, 61, 0.5);
      --ok: #47b373;
      --warn: #e0a83b;

      --border-subtle: rgba(232, 224, 210, 0.09);
      --border-strong: rgba(232, 224, 210, 0.2);

      --shadow-card: 0 2px 10px rgba(0, 0, 0, 0.22);
      --shadow-card-hover: 0 16px 32px rgba(0, 0, 0, 0.36), 0 4px 10px rgba(224, 122, 61, 0.12);
      --shadow-modal: 0 28px 72px rgba(0, 0, 0, 0.55);

      /* Syntax tokens (Dim / Sepia) */
      --syn-kw: #e587a6;
      --syn-fn: #7cb3ff;
      --syn-str: #74c69d;
      --syn-num: #f4b860;
      --syn-cmt: #8a7f70;
      --syn-type: #67d4c8;
      --syn-op: #b8ad9d;
    }

    :root[data-theme="dark"] {
      --bg-canvas: #0f1115;
      --bg-surface: #161920;
      --bg-surface-alt: #1d212b;
      --bg-code: #0b0d11;
      --bg-code-header: #13161d;
      --bg-pill: #212632;
      --bg-overlay: rgba(4, 5, 8, 0.76);

      --text-primary: #edf0f7;
      --text-secondary: #a8b1c4;
      --text-muted: #6f788c;
      --text-inverse: #0e1014;

      --accent: #5eead4;
      --accent-hover: #99f6e4;
      --accent-soft: rgba(94, 234, 212, 0.12);
      --accent-ring: rgba(94, 234, 212, 0.45);
      --ok: #4ade80;
      --warn: #facc15;

      --border-subtle: rgba(237, 240, 247, 0.08);
      --border-strong: rgba(237, 240, 247, 0.18);

      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.35);
      --shadow-card-hover: 0 18px 36px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(94, 234, 212, 0.16);
      --shadow-modal: 0 30px 80px rgba(0, 0, 0, 0.72);

      /* Syntax tokens (Dark / Charcoal) */
      --syn-kw: #f472b6;
      --syn-fn: #60a5fa;
      --syn-str: #4ade80;
      --syn-num: #fbbf24;
      --syn-cmt: #64748b;
      --syn-type: #2dd4bf;
      --syn-op: #94a3b8;
    }

    /* Smooth theme transition only when .theme-transitioning is active */
    html.theme-transitioning,
    html.theme-transitioning *,
    html.theme-transitioning *::before,
    html.theme-transitioning *::after {
      transition:
        background-color 280ms var(--ease-out),
        color 280ms var(--ease-out),
        border-color 280ms var(--ease-out),
        box-shadow 280ms var(--ease-out),
        fill 280ms var(--ease-out),
        stroke 280ms var(--ease-out) !important;
    }

    /* =========================================================================
       2. BASE & READING PROGRESS BAR
       ========================================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .progress-track {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 60;
      background: transparent;
      pointer-events: none;
    }

    .progress-bar {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--syn-fn));
      transform-origin: 0 50%;
      transform: scaleX(0);
      will-change: transform;
    }

    /* =========================================================================
       3. LAYOUT & TOP HEADER
       ========================================================================= */
    .shell {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px 84px;
    }

    .topbar {
      position: sticky;
      top: 3px;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      margin: 12px 0 28px;
      background: color-mix(in srgb, var(--bg-surface) 84%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text-primary);
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--bg-surface-alt);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-pill code {
      color: var(--accent);
      font-family: inherit;
      font-weight: 600;
    }

    .theme-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    .theme-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .theme-btn kbd {
      font-family: inherit;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg-pill);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    /* =========================================================================
       4. TYPEWRITER HERO & GITHUB COUNTERS
       ========================================================================= */
    .hero {
      padding: 20px 0 34px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 32px;
    }

    .hero-kicker {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--accent);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .hero-title {
      margin: 0 0 14px;
      font-size: clamp(24px, 4.4vw, 38px);
      line-height: 1.22;
      letter-spacing: -0.03em;
      font-weight: 700;
      min-height: 1.3em;
    }

    .cursor {
      display: inline-block;
      width: 0.58em;
      height: 1.05em;
      vertical-align: -0.12em;
      background: var(--accent);
      margin-left: 2px;
      border-radius: 1px;
    }

    .cursor.blink {
      animation: cursor-blink 1.05s steps(1, end) infinite;
    }

    @keyframes cursor-blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .hero-sub {
      margin: 0 0 22px;
      max-width: 62ch;
      color: var(--text-secondary);
      font-family: var(--font-serif);
      font-size: 19px;
      line-height: 1.55;
    }

    .gh-strip {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .gh-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .gh-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 13px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      text-decoration: none;
      color: var(--text-primary);
      font-size: 12px;
      transition: transform 220ms var(--ease-spring), border-color 200ms ease;
    }

    .gh-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .gh-repo {
      font-weight: 600;
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gh-metrics {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .gh-status {
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .gh-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok);
    }

    .gh-status.partial .dot { background: var(--warn); }
    .gh-status.offline .dot { background: var(--accent); }

    /* =========================================================================
       5. FEATURED & HOVER-RAISE ARTICLE CARDS
       ========================================================================= */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 0 0 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .feature-card {
      position: relative;
      display: block;
      width: 100%;
      text-align: left;
      padding: 24px 26px;
      margin-bottom: 24px;
      border-radius: var(--radius-lg);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      color: inherit;
      font: inherit;
      transition:
        transform 320ms var(--ease-spring),
        box-shadow 320ms var(--ease-out),
        border-color 220ms ease;
    }

    .feature-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--accent);
    }

    .feature-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 4px 9px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .card-title {
      margin: 0 0 8px;
      font-size: clamp(19px, 2.5vw, 24px);
      line-height: 1.3;
      letter-spacing: -0.02em;
      font-weight: 700;
      color: var(--text-primary);
    }

    .card-excerpt {
      margin: 0 0 14px;
      color: var(--text-secondary);
      font-family: var(--font-serif);
      font-size: 17px;
      line-height: 1.55;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .tag {
      padding: 2px 8px;
      border-radius: 4px;
      background: var(--bg-pill);
      color: var(--text-secondary);
      font-size: 11px;
    }

    .entry-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .entry-row {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: center;
      gap: 16px;
      width: 100%;
      text-align: left;
      padding: 18px 20px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-card);
      cursor: pointer;
      color: inherit;
      font: inherit;
      transition:
        transform 300ms var(--ease-spring),
        box-shadow 300ms var(--ease-out),
        border-color 220ms ease;
    }

    .entry-row:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--accent);
    }

    .entry-idx {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      transition: color 220ms ease, transform 280ms var(--ease-spring);
    }

    .entry-row:hover .entry-idx {
      color: var(--accent);
      transform: translateX(2px);
    }

    .entry-row h3 {
      margin: 0 0 4px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .entry-row p {
      margin: 0;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .entry-arrow {
      font-size: 16px;
      color: var(--text-muted);
      transition: transform 280ms var(--ease-spring), color 200ms ease;
    }

    .entry-row:hover .entry-arrow {
      transform: translateX(4px);
      color: var(--accent);
    }

    /* =========================================================================
       6. CODE BLOCKS, COPY-FLASH BUTTON & SYNTAX HIGHLIGHTING
       ========================================================================= */
    .code-block {
      margin: 22px 0;
      border-radius: var(--radius-md);
      background: var(--bg-code);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      transition: box-shadow 260ms ease, border-color 260ms ease;
    }

    .code-block.flash-pulse {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-ring);
    }

    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px 8px 14px;
      background: var(--bg-code-header);
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-muted);
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 180ms var(--ease-spring), background-color 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .copy-btn:hover {
      border-color: var(--accent);
    }

    .copy-btn.copied {
      border-color: var(--ok);
      background: color-mix(in srgb, var(--ok) 15%, var(--bg-surface));
      color: var(--ok);
      transform: scale(1.04);
    }

    .code-scroll {
      overflow-x: auto;
      padding: 12px 0;
    }

    .code-lines {
      display: table;
      width: 100%;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
    }

    .code-line {
      display: table-row;
    }

    .ln {
      display: table-cell;
      width: 44px;
      padding: 0 12px 0 14px;
      text-align: right;
      user-select: none;
      color: var(--text-muted);
      opacity: 0.65;
      font-variant-numeric: tabular-nums;
    }

    .lc {
      display: table-cell;
      padding-right: 18px;
      white-space: pre;
    }

    .tok-kw { color: var(--syn-kw); font-weight: 600; }
    .tok-fn { color: var(--syn-fn); }
    .tok-str { color: var(--syn-str); }
    .tok-num { color: var(--syn-num); }
    .tok-cmt { color: var(--syn-cmt); font-style: italic; }
    .tok-type { color: var(--syn-type); }
    .tok-op { color: var(--syn-op); }

    /* =========================================================================
       7. HASH-ROUTED READER OVERLAY (#/slug) & SERIF DROP CAP
       ========================================================================= */
    .reader-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: var(--bg-overlay);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      overflow-y: auto;
      padding: 28px 16px 64px;
    }

    .reader-backdrop.open {
      display: flex;
    }

    .reader-dialog {
      width: 100%;
      max-width: 740px;
      align-self: flex-start;
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      padding: 28px 32px 44px;
    }

    .reader-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 12px;
      color: var(--text-muted);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background: var(--bg-surface-alt);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
    }

    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .reader-title {
      margin: 0 0 10px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.22;
      letter-spacing: -0.025em;
    }

    .reader-body {
      font-family: var(--font-serif);
      font-size: 19px;
      line-height: 1.72;
      color: var(--text-primary);
    }

    .reader-body p {
      margin: 0 0 18px;
    }

    .reader-body p.lead::first-letter {
      float: left;
      font-family: var(--font-serif);
      font-size: 3.4em;
      line-height: 0.85;
      padding: 5px 10px 2px 0;
      color: var(--accent);
      font-weight: 600;
    }

    /* =========================================================================
       8. REDUCED MOTION
       ========================================================================= */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      html.theme-transitioning,
      html.theme-transitioning *,
      html.theme-transitioning *::before,
      html.theme-transitioning *::after {
        transition: none !important;
      }
      .cursor.blink {
        animation: none;
        opacity: 1;
      }
      .feature-card,
      .entry-row,
      .gh-card,
      .copy-btn,
      .entry-idx,
      .entry-arrow {
        transition: none !important;
      }
      .feature-card:hover,
      .entry-row:hover,
      .gh-card:hover {
        transform: none;
      }
    }

    @media (max-width: 600px) {
      .entry-row {
        grid-template-columns: 32px 1fr;
      }
      .entry-arrow {
        display: none;
      }
      .reader-dialog {
        padding: 20px 18px 34px;
      }
    }
  </style>
</head>
<body>
  <!-- Top Reading Progress Bar -->
  <div class="progress-track" aria-hidden="true">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="shell" id="mainShell">
    <!-- Top Bar -->
    <header class="topbar">
      <a class="brand" href="#top" id="brandLink">
        <span class="brand-dot"></span>
        <span>core.log</span>
      </a>

      <div class="topbar-right">
        <div class="status-pill" id="liveStatus" aria-live="polite">
          <span>$ status</span>
          <code id="statusReadout">up 0s · scroll 0%</code>
        </div>

        <button
          type="button"

  <script>
    (() => {
      "use strict";

      const prefersReducedMotion = () =>
        window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      /* =====================================================================
         1. ARTICLES DATA (WITH CODE BLOCKS FOR BOTH LIST & READER)
         ===================================================================== */
      const ARTICLES = [
        {
          slug: "false-sharing-at-64-bytes",
          featured: true,
          date: "2026-10-14",
          readTime: "6 min read",
          tags: ["cache", "concurrency", "c++"],
          title: "False Sharing at 64 Bytes: Why Two Counters Cost 12x",
          excerpt:
            "Two independent atomic counters on adjacent stack slots bounced a single cache line across cores until alignment forced them apart.",
          paragraphs: [
            "Cache coherence protocols move memory in cache lines—typically 64 bytes on x86_64 and ARM64—rather than single bytes. When Thread A writes to counter x and Thread B writes to counter y right next to it, the hardware still fights ownership of the shared line.",
            "Adding alignas(64) separates the hot fields so each worker core owns its cache line cleanly, turning contention stalls into predictable L1 hits.",
            {
              type: "code",
              lang: "cpp",
              filename: "counters.hpp",
              code: [
                "#include <atomic>",
                "#include <cstddef>",
                "",

                "  std::atomic<uint64_t> value{0};",
                "  std::byte pad[64 - sizeof(std::atomic<uint64_t>)];",
                "};",
                "",
                "inline uint64_t bump(PaddedCounter& c) noexcept {",
                "  return c.value.fetch_add(1, std::memory_order_relaxed);",
                "}"
              ].join("\n")
            },
            "Measure before and after with hardware counters rather than guessing: false sharing is invisible in clean single-threaded unit tests and loud under load."
          ]
        },
        {

          date: "2026-09-28",

          title: "Power-of-Two Ring Buffers Without Modulo Pain",
          excerpt:
            "Monotonic head and tail indices paired with a capacity mask keep empty vs. full states unambiguous and branch-light.",
          paragraphs: [
            "Keeping head and tail as monotonically increasing counters instead of wrapping them early eliminates off-by-one ambiguity when head equals tail.",
            {
              type: "code",
              lang: "rust",
              filename: "ring.rs",
              code: [
                "pub struct MaskRing<T> {",
                "    buf: Box<[Option<T>]>,",
                "    mask: usize, // cap must be power of two",
                "    head: usize,",
                "    tail: usize,",
                "}",
                "",
                "impl<T> MaskRing<T> {",
                "    pub fn push(&mut self, item: T) -> Result<(), T> {",
                "        if self.head - self.tail == self.buf.len() {",
                "            return Err(item);",
                "        }",
                "        self.buf[self.head & self.mask] = Some(item);",
                "        self.head += 1;",

            },

        },
        {

          featured: false,
          date: "2026-08-19",
          readTime: "5 min read",
          tags: ["posix", "fsync", "reliability"],
          title: "Atomic Config Writes: Temp File, Fsync, Rename",
          excerpt:
            "Truncating a live config file in place is a classic recipe for half-written state after a sudden power loss.",
          paragraphs: [
            "Write to a sibling temporary file in the same directory, fsync the file descriptor, close it, rename over the target path, and fsync the parent directory.",
            {
              type: "code",
              lang: "js",
              filename: "atomic-write.mjs",
              code: [
                "import fs from 'node:fs/promises';",
                "import path from 'node:path';",
                "",
                "export async function writeAtomic(targetPath, content) {",
                "  const dir = path.dirname(targetPath);",
                "  const tmp = path.join(dir, `.tmp-${process.pid}-${Date.now()}`);",
                "  const fh = await fs.open(tmp, 'w', 0o644);",
                "  await fh.writeFile(content, 'utf8');",
                "  await fh.sync();",
                "  await fh.close();",
                "  await fs.rename(tmp, targetPath);",

      ];

      /* =====================================================================
         2. SYNTAX HIGHLIGHTER & COPY-FLASH CODE BLOCK BUILDER
         ===================================================================== */
      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function highlightLine(rawLine, lang) {
        const commentSplit =
          lang === "python"
            ? rawLine.indexOf("#")
            : rawLine.indexOf("//");

        let codePart = rawLine;
        let commentPart = "";

        if (commentSplit !== -1) {
          codePart = rawLine.slice(0, commentSplit);
          commentPart = rawLine.slice(commentSplit);
        }

        const keywords = new Set([
          "const", "let", "var", "function", "async", "await", "return", "if", "else",
          "import", "export", "from", "struct", "impl", "pub", "fn", "mut", "use", "for",
          "while", "in", "of", "true", "false", "null", "Ok", "Err", "Some", "None", "Result", "Option"
        ]);
        const types = new Set([
          "uint64_t", "usize", "Box", "String", "Vec", "Promise", "Map", "Set", "std", "fs", "path"
        ]);

        // Tokenize strings, words, numbers, and punctuation safely without nested regex overlap
        const tokenRegex = /('[^']*'|"[^"]*"|`[^`]*`|\b[A-Za-z_][A-Za-z0-9_]*\b|\b\d+(?:_\d+)*(?:\.\d+)?\b|[^\sA-Za-z0-9_]+)/g;
        let out = "";
        let lastIndex = 0;

        for (const match of codePart.matchAll(tokenRegex)) {
          const tok = match[0];
          const idx = match.index ?? 0;
          if (idx > lastIndex) {
            out += escapeHtml(codePart.slice(lastIndex, idx));
          }
          lastIndex = idx + tok.length;

          if (tok.startsWith("'") || tok.startsWith('"') || tok.startsWith("`")) {
            out += `<span class="tok-str">${escapeHtml(tok)}</span>`;
          } else if (/^\d/.test(tok)) {
            out += `<span class="tok-num">${escapeHtml(tok)}</span>`;
          } else if (keywords.has(tok)) {
            out += `<span class="tok-kw">${escapeHtml(tok)}</span>`;
          } else if (types.has(tok)) {
            out += `<span class="tok-type">${escapeHtml(tok)}</span>`;
          } else if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(tok)) {
            const nextChar = codePart[idx + tok.length] || "";
            if (nextChar === "(") {
              out += `<span class="tok-fn">${escapeHtml(tok)}</span>`;
            } else {
              out += escapeHtml(tok);
            }
          } else {
            out += `<span class="tok-op">${escapeHtml(tok)}</span>`;
          }
        }

        if (lastIndex < codePart.length) {
          out += escapeHtml(codePart.slice(lastIndex));
        }

        if (commentPart) {
          out += `<span class="tok-cmt">${escapeHtml(commentPart)}</span>`;
        }

        return out || " ";
      }

      function renderCodeBlock(block) {
        const lines = block.code.split("\n");
        const linesHtml = lines
          .map(
            (line, i) =>
              `<div class="code-line"><span class="ln">${i + 1}</span><span class="lc">${highlightLine(line, block.lang)}</span></div>`
          )
          .join("");

        return `
          <div class="code-block" data-code="${encodeURIComponent(block.code)}">
            <div class="code-header">
              <span>${escapeHtml(block.filename || block.lang)}</span>
              <button type="button" class="copy-btn" data-copy-btn aria-label="Copy code snippet">
                <span class="copy-icon" aria-hidden="true">⧉</span>
                <span class="copy-label">copy</span>
              </button>
            </div>
            <div class="code-scroll">
              <div class="code-lines">${linesHtml}</div>
            </div>
          </div>
        `;
      }

      async function copyText(text) {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          try {
            await navigator.clipboard.writeText(text);
            return true;
          } catch {
            // Fall through to execCommand
          }
        }
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand("copy");
        } catch {
          ok = false;
        }
        document.body.removeChild(ta);
        return ok;
      }

      // Shared delegated handler across main page and reader modal
      document.addEventListener("click", async (ev) => {
        const btn = ev.target.closest("[data-copy-btn]");
        if (!btn) return;
        const block = btn.closest(".code-block");
        if (!block) return;

        const code = decodeURIComponent(block.getAttribute("data-code") || "");
        const ok = await copyText(code);
        if (!ok) return;

        const iconEl = btn.querySelector(".copy-icon");
        const labelEl = btn.querySelector(".copy-label");
        const prevIcon = iconEl ? iconEl.textContent : "⧉";
        const prevLabel = labelEl ? labelEl.textContent : "copy";

        btn.classList.add("copied");
        if (iconEl) iconEl.textContent = "✓";
        if (labelEl) labelEl.textContent = "copied";

        block.classList.remove("flash-pulse");
        void block.offsetWidth; // trigger reflow for one-shot pulse
        block.classList.add("flash-pulse");

        window.clearTimeout(btn._copyTimer);
        btn._copyTimer = window.setTimeout(() => {
          btn.classList.remove("copied");
          if (iconEl) iconEl.textContent = prevIcon;
          if (labelEl) labelEl.textContent = prevLabel;
        }, 1600);

        window.clearTimeout(block._pulseTimer);
        block._pulseTimer = window.setTimeout(() => {
          block.classList.remove("flash-pulse");
        }, 650);
      });

      /* =====================================================================
         3. RENDER ARTICLE CARDS & HASH-ROUTED READER (#/slug)
         ===================================================================== */
      const featuredMount = document.getElementById("featuredMount");
      const entriesMount = document.getElementById("entriesMount");
      const readerBackdrop = document.getElementById("readerBackdrop");
      const readerDialog = document.getElementById("readerDialog");
      const readerTitle = document.getElementById("readerTitle");
      const readerMeta = document.getElementById("readerMeta");
      const readerBody = document.getElementById("readerBody");
      const closeReaderBtn = document.getElementById("closeReaderBtn");

      let lastTriggerEl = null;
      let savedMainScrollY = 0;

      function renderCards() {
        const featured = ARTICLES.find((a) => a.featured) || ARTICLES[0];
        const others = ARTICLES.filter((a) => a.slug !== featured.slug);

        featuredMount.innerHTML = `
          <button type="button" class="feature-card" data-open-slug="${escapeHtml(featured.slug)}">
            <span class="feature-badge">★ featured post</span>
            <h3 class="card-title">${escapeHtml(featured.title)}</h3>
            <p class="card-excerpt">${escapeHtml(featured.excerpt)}</p>
            <div class="card-meta">
              <span>${escapeHtml(featured.date)}</span>
              <span>·</span>
              <span>${escapeHtml(featured.readTime)}</span>
              ${featured.tags.map((t) => `<span class="tag">#${escapeHtml(t)}</span>`).join("")}
            </div>
          </button>
        `;

        entriesMount.innerHTML = others
          .map(
            (art, idx) => `
              <button type="button" class="entry-row" data-open-slug="${escapeHtml(art.slug)}">
                <span class="entry-idx">${String(idx + 1).padStart(2, "0")}</span>
                <div>
                  <h3>${escapeHtml(art.title)}</h3>
                  <p>${escapeHtml(art.excerpt)}</p>
                </div>
                <span class="entry-arrow" aria-hidden="true">→</span>
              </button>
            `
          )
          .join("");
      }

      function openArticle(slug, triggerEl) {
        const article = ARTICLES.find((a) => a.slug === slug);
        if (!article) {
          closeArticle(false);
          return;
        }

        if (!readerBackdrop.classList.contains("open")) {
          savedMainScrollY = window.scrollY || window.pageYOffset || 0;
          lastTriggerEl = triggerEl || document.activeElement;
        }

        readerTitle.textContent = article.title;
        readerMeta.textContent = `${article.date} · ${article.readTime}`;
        readerBody.innerHTML = article.paragraphs
          .map((item, idx) => {
            if (typeof item === "string") {
              const cls = idx === 0 ? ' class="lead"' : "";
              return `<p${cls}>${escapeHtml(item)}</p>`;
            }
            if (item && item.type === "code") {
              return renderCodeBlock(item);
            }
            return "";
          })
          .join("");

        readerBackdrop.classList.add("open");
        readerBackdrop.scrollTop = 0;
        document.title = `${article.title} — core.log`;

        const targetHash = `#/${article.slug}`;
        if (window.location.hash !== targetHash) {
          window.location.hash = targetHash;
        }

        closeReaderBtn.focus();
        scheduleProgressUpdate();
      }

      function closeArticle(restoreHash = true) {
        if (!readerBackdrop.classList.contains("open")) return;
        readerBackdrop.classList.remove("open");
        document.title = "core.log — notes from the stack";

        if (restoreHash && window.location.hash.startsWith("#/")) {
          history.replaceState(null, "", window.location.pathname + window.location.search);
        }

        window.scrollTo(0, savedMainScrollY);
        if (lastTriggerEl && typeof lastTriggerEl.focus === "function") {
          lastTriggerEl.focus();
          lastTriggerEl = null;
        }
        scheduleProgressUpdate();
      }

      document.addEventListener("click", (ev) => {
        const card = ev.target.closest("[data-open-slug]");
        if (!card) return;
        const slug = card.getAttribute("data-open-slug");
        openArticle(slug, card);
      });

      closeReaderBtn.addEventListener("click", () => closeArticle(true));

      readerBackdrop.addEventListener("click", (ev) => {
        if (ev.target === readerBackdrop) {
          closeArticle(true);
        }
      });

      function syncFromHash() {
        const h = window.location.hash || "";
        if (h.startsWith("#/")) {
          const slug = h.slice(2).trim();
          if (slug) {
            openArticle(slug, null);
            return;
          }
        }
        closeArticle(false);
      }

      window.addEventListener("hashchange", syncFromHash);

      /* =====================================================================
         4. READING PROGRESS BAR (rAF) & LIVE $ STATUS READOUT
         ===================================================================== */
      const progressBar = document.getElementById("progressBar");
      const statusReadout = document.getElementById("statusReadout");
      const startTime = Date.now();
      let latestScrollPct = 0;
      let rafScheduled = false;

      function computeScrollPct() {
        if (readerBackdrop.classList.contains("open")) {
          const maxScroll = readerBackdrop.scrollHeight - readerBackdrop.clientHeight;
          if (maxScroll <= 0) return 100;
          return Math.min(100, Math.max(0, (readerBackdrop.scrollTop / maxScroll) * 100));
        }
        const doc = document.documentElement;
        const maxScroll = doc.scrollHeight - window.innerHeight;
        if (maxScroll <= 0) return 0;
        const y = window.scrollY || window.pageYOffset || 0;
        return Math.min(100, Math.max(0, (y / maxScroll) * 100));
      }

      function formatUptime(sec) {
        if (sec < 60) return `${sec}s`;
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        if (m < 60) return `${m}m ${s}s`;
        const h = Math.floor(m / 60);
        return `${h}h ${m % 60}m`;
      }

      function updateStatusText() {
        const upSec = Math.floor((Date.now() - startTime) / 1000);
        statusReadout.textContent = `up ${formatUptime(upSec)} · scroll ${Math.round(latestScrollPct)}%`;
      }

      function updateProgressNow() {
        rafScheduled = false;
        latestScrollPct = computeScrollPct();
        progressBar.style.transform = `scaleX(${(latestScrollPct / 100).toFixed(4)})`;
        updateStatusText();
      }

      function scheduleProgressUpdate() {
        if (rafScheduled) return;
        rafScheduled = true;
        window.requestAnimationFrame(updateProgressNow);
      }

      window.addEventListener("scroll", scheduleProgressUpdate, { passive: true });
      window.addEventListener("resize", scheduleProgressUpdate, { passive: true });
      readerBackdrop.addEventListener("scroll", scheduleProgressUpdate, { passive: true });
      window.setInterval(updateStatusText, 1000);

      /* =====================================================================
         5. TYPEWRITER HERO DSL (type / wait / del / delAll + TYPO FIX)
         ===================================================================== */
      const typewriterText = document.getElementById("typewriterText");
      const typewriterCursor = document.getElementById("typewriterCursor");

      const HERO_SCRIPT = [
        { type: "type", text: "debugging buigs" },
        { type: "wait", ms: 420 },
        { type: "del", count: 4 }, // deletes "uigs" -> "debugging b"
        { type: "type", text: "ugs in production." },
        { type: "wait", ms: 1300 },
        { type: "delAll" },
        { type: "type", text: "small binaries, zero drama." }
      ];

      function runTypewriter(steps) {
        if (prefersReducedMotion()) {
          typewriterText.textContent = "small binaries, zero drama.";
          typewriterCursor.classList.add("blink");
          return;
        }

        typewriterText.textContent = "";
        typewriterCursor.classList.remove("blink");

        let stepIdx = 0;

        function nextStep() {
          if (stepIdx >= steps.length) {
            typewriterCursor.classList.add("blink");
            return;
          }
          const step = steps[stepIdx++];
          typewriterCursor.classList.remove("blink");

          if (step.type === "wait") {
            typewriterCursor.classList.add("blink");
            window.setTimeout(nextStep, step.ms);
            return;
          }

          if (step.type === "delAll") {
            const current = typewriterText.textContent;
            let i = current.length;
            function stepDelAll() {
              if (i <= 0) {
                typewriterText.textContent = "";
                nextStep();
                return;
              }
              i -= 2;
              typewriterText.textContent = current.slice(0, Math.max(0, i));
              window.setTimeout(stepDelAll, 22);
            }
            stepDelAll();
            return;
          }

          if (step.type === "del") {
            let remaining = step.count;
            function stepDel() {
              if (remaining <= 0) {
                nextStep();
                return;
              }
              typewriterText.textContent = typewriterText.textContent.slice(0, -1);
              remaining -= 1;
              window.setTimeout(stepDel, 58);
            }
            stepDel();
            return;
          }

          if (step.type === "type") {
            const chars = Array.from(step.text);
            let idx = 0;
            function stepType() {
              if (idx >= chars.length) {
                nextStep();
                return;
              }
              const ch = chars[idx++];
              typewriterText.textContent += ch;

              let delay = 42 + Math.floor(Math.random() * 58);
              if (ch === "." || ch === "," || ch === ":" || ch === "!") {
                delay += 180;
              }
              window.setTimeout(stepType, delay);
            }
            stepType();
          }
        }

        nextStep();
      }

      /* =====================================================================
         6. LIVE GITHUB STAR / FORK COUNTERS + localStorage FALLBACK
         ===================================================================== */
      const GH_REPOS = [
        "torvalds/linux",
        "rust-lang/rust",
        "microsoft/vscode"
      ];
      const GH_CACHE_KEY = "core_log_gh_cache_v1";
      const ghGrid = document.getElementById("ghGrid");
      const ghStatus = document.getElementById("ghStatus");
      const ghStatusText = document.getElementById("ghStatusText");

      function loadCachedRepos() {
        try {
          const raw = localStorage.getItem(GH_CACHE_KEY);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch {
          return {};
        }
      }

      function saveCachedRepos(map) {
        try {
          localStorage.setItem(GH_CACHE_KEY, JSON.stringify(map));
        } catch {
          // Ignore storage quota errors
        }
      }

      function formatCompact(n) {
        if (typeof n !== "number" || Number.isNaN(n)) return "—";
        if (n >= 1000) return `${(n / 1000).toFixed(1)}k`;
        return String(n);
      }

      function renderGhCards(dataMap) {
        ghGrid.innerHTML = GH_REPOS.map((repo) => {
          const entry = dataMap[repo] || {};
          const starsText = formatCompact(entry.stars);
          const forksText = formatCompact(entry.forks);
          return `
            <a class="gh-card" href="https://github.com/${escapeHtml(repo)}" target="_blank" rel="noopener noreferrer">
              <span class="gh-repo">${escapeHtml(repo)}</span>
              <span class="gh-metrics">
                <span data-repo="${escapeHtml(repo)}" data-metric="stars" data-val="${entry.stars ?? ""}">★ ${starsText}</span>
                <span data-repo="${escapeHtml(repo)}" data-metric="forks" data-val="${entry.forks ?? ""}">⑂ ${forksText}</span>
              </span>
            </a>
          `;
        }).join("");
      }

      function animateCountUp(el, prefix, targetVal) {
        if (typeof targetVal !== "number" || Number.isNaN(targetVal)) {
          el.textContent = `${prefix} —`;
          return;
        }
        if (prefersReducedMotion()) {
          el.textContent = `${prefix} ${formatCompact(targetVal)}`;
          return;
        }
        const duration = 650;
        const t0 = performance.now();
        function frame(now) {
          const p = Math.min(1, (now - t0) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          const current = Math.round(eased * targetVal);
          el.textContent = `${prefix} ${formatCompact(current)}`;
          if (p < 1) {
            window.requestAnimationFrame(frame);
          } else {
            el.textContent = `${prefix} ${formatCompact(targetVal)}`;
          }
        }
        window.requestAnimationFrame(frame);
      }

      async function fetchRepoWithTimeout(repo, timeoutMs = 9000) {
        const controller = new AbortController();
        const timer = window.setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(`https://api.github.com/repos/${repo}`, {
            signal: controller.signal,
            headers: { Accept: "application/vnd.github+json" }
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          return {
            stars: Number(json.stargazers_count),
            forks: Number(json.forks_count),
            updatedAt: Date.now()
          };
        } finally {
          window.clearTimeout(timer);
        }
      }

      async function initGitHubCounters() {
        const cached = loadCachedRepos();
        renderGhCards(cached);

        const results = await Promise.allSettled(
          GH_REPOS.map((repo) => fetchRepoWithTimeout(repo, 9000))
        );

        let okCount = 0;
        const merged = { ...cached };

        results.forEach((res, idx) => {
          const repo = GH_REPOS[idx];
          if (res.status === "fulfilled") {
            okCount += 1;
            merged[repo] = res.value;
          }
        });

        saveCachedRepos(merged);

        GH_REPOS.forEach((repo) => {
          const info = merged[repo];
          if (!info) return;
          const starEl = ghGrid.querySelector(`[data-repo="${repo}"][data-metric="stars"]`);
          const forkEl = ghGrid.querySelector(`[data-repo="${repo}"][data-metric="forks"]`);
          if (starEl) animateCountUp(starEl, "★", info.stars);
          if (forkEl) animateCountUp(forkEl, "⑂", info.forks);
        });

        ghStatus.classList.remove("partial", "offline");
        if (okCount === GH_REPOS.length) {
          ghStatusText.textContent = "Live GitHub REST API counters synced";
        } else if (okCount > 0) {
          ghStatus.classList.add("partial");
          ghStatusText.textContent = `Partial live sync (${okCount}/${GH_REPOS.length}); cached values used for remaining repos`;
        } else {
          ghStatus.classList.add("offline");
          ghStatusText.textContent = Object.keys(cached).length
            ? "Offline / rate-limited — showing cached GitHub counts"
            : "Offline / rate-limited — unable to reach GitHub API";
        }
      }

      /* =====================================================================
         7. 3-STATE THEME TOGGLE (LIGHT / DIM / DARK) + 'T' SHORTCUT
         ===================================================================== */
      const THEME_ORDER = ["light", "dim", "dark"];
      const THEME_META = {
        light: { icon: "☀", label: "light" },
        dim: { icon: "◐", label: "dim" },
        dark: { icon: "☾", label: "dark" }
      };
      const THEME_STORAGE_KEY = "core_log_theme_v1";

      const themeToggle = document.getElementById("themeToggle");
      const themeIcon = document.getElementById("themeIcon");
      const themeLabel = document.getElementById("themeLabel");

      function getInitialTheme() {
        try {
          const saved = localStorage.getItem(THEME_STORAGE_KEY);
          if (saved && THEME_ORDER.includes(saved)) return saved;
        } catch {
          // Ignore storage access errors
        }
        if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          return "dark";
        }
        return "light";
      }

      function applyTheme(theme, animate = false) {
        const next = THEME_ORDER.includes(theme) ? theme : "light";
        if (animate && !prefersReducedMotion()) {
          document.documentElement.classList.add("theme-transitioning");
          window.clearTimeout(applyTheme._t);
          applyTheme._t = window.setTimeout(() => {
            document.documentElement.classList.remove("theme-transitioning");
          }, 320);
        }

        document.documentElement.setAttribute("data-theme", next);
        themeIcon.textContent = THEME_META[next].icon;
        themeLabel.textContent = THEME_META[next].label;

        try {
          localStorage.setItem(THEME_STORAGE_KEY, next);
        } catch {
          // Ignore storage access errors
        }
      }

      function cycleTheme() {
        const current = document.documentElement.getAttribute("data-theme") || "light";
        const idx = THEME_ORDER.indexOf(current);
        const next = THEME_ORDER[(idx + 1) % THEME_ORDER.length];
        applyTheme(next, true);
      }

      themeToggle.addEventListener("click", cycleTheme);

      document.addEventListener("keydown", (ev) => {
        if (ev.key === "Escape" && readerBackdrop.classList.contains("open")) {
          closeArticle(true);
          return;
        }

        const tag = ev.target && ev.target.tagName ? ev.target.tagName.toLowerCase() : "";
        const isEditable =
          tag === "input" ||
          tag === "textarea" ||
          tag === "select" ||
          Boolean(ev.target && ev.target.isContentEditable);

        if (!isEditable && !ev.metaKey && !ev.ctrlKey && !ev.altKey && (ev.key === "t" || ev.key === "T")) {
          ev.preventDefault();
          cycleTheme();
        }
      });

      /* =====================================================================
         8. BOOTSTRAP
         ===================================================================== */
      applyTheme(getInitialTheme(), false);
      renderCards();
      runTypewriter(HERO_SCRIPT);
      initGitHubCounters();
      syncFromHash();
      scheduleProgressUpdate();
    })();
  </script>
</body>
</html>
